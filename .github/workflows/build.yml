name: Publish macOS DMG

on:
  push:
    branches:
      - 'main'
      - 'agent/microphone-input'
    tags:
      - 'v*'

jobs:
  build-macos:
    runs-on: macos-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: dtolnay/rust-toolchain@stable
      - run: brew install protobuf
      - run: npm install
      - run: npm run tauri build -- --bundles dmg
      - uses: actions/upload-artifact@v4
        with:
          name: macos-dmg
          path: src-tauri/target/release/bundle/dmg/*.dmg
      - name: Upload DMG to prerelease
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload v0.1.8-microphone.1 src-tauri/target/release/bundle/dmg/*.dmg --clobber
